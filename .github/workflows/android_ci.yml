name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v3
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Prepare patched yt-dlp
        run: sh scripts/prepare-patched-ytdlp.sh

      - name: Build installable debug APKs
        run: ./gradlew assembleGenericDebug --no-daemon

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: seal-debug-apks
          path: app/build/outputs/apk/generic/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify release build
        run: ./gradlew buildGenericRelease --no-daemon
